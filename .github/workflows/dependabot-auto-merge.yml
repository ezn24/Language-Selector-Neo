name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.event.action != 'closed') }}

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "dependabot[bot]" \
            --state open \
            --json url \
            --jq '.[].url' | while read pr; do
              gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$pr"
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-after-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]' }}

    steps:
      - name: Trigger patch release after Dependabot merge
        run: |
          gh workflow run "Build and Publish APK on Updates" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
