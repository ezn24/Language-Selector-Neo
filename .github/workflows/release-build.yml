name: Build and Publish APK on Updates

on:
  push:
    branches: [main, work]
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:
  release:
    types: [published]

# Prevent duplicate runs for the same branch or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v4

      - name: Install platform-tools, platform 37.0, build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump patch version for main app updates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          version_name_match = re.search(r'versionName\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text)
          version_code_match = re.search(r'versionCode\s*=\s*(\d+)', text)
          if not version_name_match or not version_code_match:
              raise SystemExit("Could not find semantic versionName and versionCode in app/build.gradle.kts")

          major, minor, patch = map(int, version_name_match.groups())
          version_code = int(version_code_match.group(1))
          new_version_name = f"{major}.{minor}.{patch + 1}"
          new_version_code = version_code + 1

          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{new_version_name}"', text, count=1)
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_version_code}', text, count=1)
          path.write_text(text)
          print(f"Bumped app version to {new_version_name} ({new_version_code})")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump app version for release [skip ci]"
          git push

      - name: Set release commit
        run: echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > $HOME/release.keystore
          echo "RELEASE_SIGNING_KEYSTORE=$HOME/release.keystore" >> $GITHUB_ENV
          echo "RELEASE_SIGNING_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "RELEASE_SIGNING_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> $GITHUB_ENV
          echo "RELEASE_SIGNING_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Read app version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$VERSION_NAME" >> $GITHUB_ENV

      - name: Publish APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: "v${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})"
          commit: ${{ env.RELEASE_COMMIT }}
          artifacts: app/build/outputs/apk/release/*.apk
          artifactContentType: application/vnd.android.package-archive
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
